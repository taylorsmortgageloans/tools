<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Altura Homes Payment Estimator</title>
<meta name="description" content="Altura Homes builder-prepared estimate of monthly housing payments for up to three homes. Not a loan quote or approval." />
<meta name="theme-color" content="#0e1115" />
<style>
  /* Altura Homes palette — charcoal #0e1115, warm bronze accent */
  :root{
    --bg:#F5F7F9;
    --surface:#FFFFFF;
    --ink:#16222B;
    --ink-2:#48575F;
    --ink-3:#7B8992;
    --line:#E2E7EB;
    --line-2:#EFF2F5;
    --accent:#1E2A33;
    --accent-soft:#EEF1F3;
    --accent-ink:#0e1115;
    --green:#5FA845;
    --green-soft:#EFF7E7;
    --green-ink:#4C7F28;
    --orange:#B08D57;
    --warn-bg:#FEF4E6;
    --warn-ink:#9A5E12;
    --radius:16px;
    --radius-sm:10px;
    --shadow:0 1px 2px rgba(23,32,28,.04), 0 8px 24px rgba(23,32,28,.06);
    --shadow-sm:0 1px 2px rgba(23,32,28,.05);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:20px 16px 56px}
  @media(min-width:768px){ .wrap{padding:32px 24px 72px} }

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .muted{color:var(--ink-3)}
  .tiny{font-size:12px;line-height:1.45}
  .small{font-size:13px}

  /* ---------- Branding ---------- */
  .brand{padding:20px 18px 18px;margin-bottom:16px;position:relative;overflow:hidden}
  @media(min-width:768px){ .brand{padding:24px} }
  .brand::before{
    content:"";position:absolute;top:0;left:0;right:0;height:5px;
    background:linear-gradient(to right,var(--accent) 0 70%,var(--orange) 70% 100%)
  }
  .brand-row{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between}
  .logo-box{
    width:200px;max-width:62vw;border-radius:10px;display:flex;align-items:center;justify-content:flex-start;overflow:hidden
  }
  .logo-box.placeholder{
    width:180px;height:84px;background:var(--accent-soft);border:1px dashed #BBD5E6;
    align-items:center;justify-content:center;color:var(--accent);font-size:11px;font-weight:700;
    letter-spacing:.06em;text-align:center;text-transform:uppercase
  }
  .logo-box img{width:100%;height:auto;display:block}
  .brand-name{font-size:19px;font-weight:700;letter-spacing:-.01em;margin:0}
  .brand-sub{font-size:13.5px;color:var(--ink-2);margin:3px 0 0}
  .brand-right{text-align:left;min-width:0}
  @media(min-width:768px){ .brand-right{text-align:right} }
  .brand-tag{font-size:12.5px;font-weight:700;letter-spacing:.02em;margin:8px 0 0;color:var(--ink-3)}
  .brand-tag b:nth-of-type(1){color:var(--accent)}
  .brand-tag b:nth-of-type(2){color:var(--green-ink)}
  .brand-tag b:nth-of-type(3){color:var(--orange)}
  .brand-pill{
    display:inline-block;background:var(--green-soft);color:var(--green-ink);border:1px solid #DCEBCC;
    border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;margin-top:8px
  }
  .link-btn{
    background:none;border:0;color:var(--accent);font:inherit;font-size:13px;font-weight:600;
    cursor:pointer;padding:8px 0;text-decoration:underline;text-underline-offset:3px
  }
  .brand-edit{margin-top:18px;border-top:1px solid var(--line-2);padding-top:18px}
  .grid-fields{display:grid;gap:12px;grid-template-columns:1fr}
  @media(min-width:640px){ .grid-fields{grid-template-columns:1fr 1fr} }
  @media(min-width:960px){ .grid-fields{grid-template-columns:1fr 1fr 1fr} }

  label.lbl{display:block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
  input.txt,select.txt{
    width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius-sm);
    background:#fff;color:var(--ink);font:inherit;font-size:16px;min-height:48px;
    appearance:none;-webkit-appearance:none
  }
  input.txt:focus,select.txt:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  select.txt{
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%234A554E' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat:no-repeat;background-position:right 14px center;padding-right:40px
  }
  .input-affix{position:relative}
  .input-affix .affix{position:absolute;top:50%;transform:translateY(-50%);color:var(--ink-3);font-size:16px;pointer-events:none}
  .input-affix.pre .affix{left:14px}
  .input-affix.pre input{padding-left:30px}
  .input-affix.post .affix{right:14px}
  .input-affix.post input{padding-right:34px}

  /* ---------- Hero / inputs ---------- */
  h1.title{font-size:24px;line-height:1.2;letter-spacing:-.02em;margin:0 0 6px}
  @media(min-width:768px){ h1.title{font-size:30px} }
  .subtitle{color:var(--ink-2);margin:0 0 18px;font-size:15px}
  .panel{padding:18px;margin-bottom:16px}
  @media(min-width:768px){ .panel{padding:24px} }
  .panel h2{font-size:15px;margin:0 0 16px;letter-spacing:-.01em}

  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--line-2);padding:5px;border-radius:12px}
  .seg.two{grid-template-columns:repeat(2,1fr)}
  .seg button{
    border:0;background:transparent;font:inherit;font-weight:600;font-size:15px;color:var(--ink-2);
    padding:11px 8px;border-radius:9px;cursor:pointer;min-height:46px;transition:background .12s,color .12s,box-shadow .12s
  }
  .seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent-ink);box-shadow:var(--shadow-sm)}
  .seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .inputs-grid{display:grid;gap:16px;grid-template-columns:1fr}
  @media(min-width:760px){ .inputs-grid{grid-template-columns:1.2fr 1fr 1fr} }

  .notice{
    display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);color:var(--accent-ink);
    border-radius:12px;padding:12px 14px;font-size:13px;margin:0 0 16px;border:1px solid #D3E5F1
  }
  .notice .dot{color:var(--orange);font-size:15px;line-height:1.25}
  .warn{background:var(--warn-bg);color:var(--warn-ink);border:1px solid #F6E1BE;border-radius:10px;padding:10px 12px;font-size:13px;margin-top:10px}

  /* ---------- Comparison ---------- */
  .cols{display:grid;gap:16px;grid-template-columns:1fr;align-items:start}
  @media(min-width:1024px){ .cols{grid-template-columns:repeat(3,1fr);gap:18px} }

  .home{overflow:hidden}
  .home-head{padding:18px 18px 16px;border-bottom:1px solid var(--line-2)}
  .home-eyebrow{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:0 0 12px}
  .facts{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px;display:grid;gap:7px}
  .fact{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;color:var(--ink-2)}
  .fact b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

  .years{padding:6px 18px 4px}
  .year{padding:16px 0;border-bottom:1px solid var(--line-2)}
  .year:last-child{border-bottom:0}
  .year-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .year-name{font-size:14px;font-weight:700;margin:0}
  .rate-chip{
    font-size:12px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);
    border-radius:999px;padding:4px 10px;white-space:nowrap
  }
  .rate-chip.buydown{color:var(--green-ink);background:var(--green-soft)}
  .amount{font-size:34px;font-weight:700;letter-spacing:-.03em;margin:6px 0 0;font-variant-numeric:tabular-nums}
  @media(min-width:1024px){ .amount{font-size:32px} }
  .amount span{font-size:14px;font-weight:600;color:var(--ink-3);letter-spacing:0}
  .year-note{margin:4px 0 0;font-size:12.5px;color:var(--ink-3)}
  .year.hl .amount{color:var(--accent-ink)}

  .disclose-btn{
    width:100%;background:#FBFBFA;border:0;border-top:1px solid var(--line-2);font:inherit;font-size:14px;font-weight:600;
    color:var(--accent);padding:15px 18px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;min-height:52px
  }
  .disclose-btn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .chev{transition:transform .18s;display:inline-block}
  .chev.open{transform:rotate(180deg)}
  .breakdown{padding:4px 18px 18px;background:#FBFBFA;border-top:1px solid var(--line-2)}
  .bd-block{padding:14px 0;border-bottom:1px solid var(--line-2)}
  .bd-block:last-child{border-bottom:0}
  .bd-title{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px}
  .bd-row{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:4px 0;color:var(--ink-2)}
  .bd-row span:last-child{font-variant-numeric:tabular-nums;color:var(--ink)}
  .bd-row.total{border-top:1px solid var(--line);margin-top:6px;padding-top:9px;font-weight:700;color:var(--ink)}
  .bd-note{font-size:12px;color:var(--ink-3);margin:8px 0 0}

  .info{
    display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;
    border:1px solid var(--ink-3);color:var(--ink-3);font-size:11px;font-weight:700;margin-left:6px;cursor:help;line-height:1
  }

  footer.disclosure{margin-top:24px;padding:18px;border-radius:var(--radius);background:#ECF1F5;border:1px solid var(--line)}
  footer.disclosure b{color:var(--ink)}
  footer.disclosure p{margin:0 0 10px;font-size:12px;line-height:1.6;color:var(--ink-2)}
  footer.disclosure p:last-child{margin-bottom:0}
  .eho{display:inline-block;font-weight:700}
  .print-only{display:none}
  @media print{
    body{background:#fff}
    .disclose-btn,.link-btn,.brand-edit{display:none !important}
    .card{box-shadow:none}
    .cols{grid-template-columns:repeat(3,1fr)}
  }
  .logo-box.text-logo{border:0;background:transparent;width:auto;height:auto;padding:0}
  .wordmark{white-space:nowrap;font-size:clamp(18px,5vw,26px);font-weight:300;letter-spacing:.32em;text-transform:uppercase;color:var(--accent-ink)}
</style>

/* =========================================================================
   Calculation utilities — single source of truth for all math.
   ========================================================================= */
const findCommunity = (name) => CONFIG.communities.find(c => c.name === name);
const findPlan = (community, plan) => { const c = findCommunity(community); return c ? c.plans.find(p => p.name === plan) : null; };
const LOAN_TYPES = ["conventional", "fha", "va"];
const typeCfg = (loanType) => CONFIG[loanType];
const productCfg = (loanType) => CONFIG.products[loanType];

function calculateBaseLoanAmount(purchasePrice, downPayment) {
  return Math.max(0, purchasePrice - downPayment);
}

function calculateFHAUpfrontMIP(baseLoanAmount) {
  return baseLoanAmount * CONFIG.fha.upfrontMipRate;
}

function calculateVAFundingFee(baseLoanAmount) {
  return baseLoanAmount * CONFIG.va.fundingFeeRate;
}

/** Financed amount actually used for principal & interest. */
function calculateFinancedLoanAmount(baseLoanAmount, loanType) {
  if (loanType === "fha") return baseLoanAmount + calculateFHAUpfrontMIP(baseLoanAmount);
  if (loanType === "va")  return baseLoanAmount + calculateVAFundingFee(baseLoanAmount);
  return baseLoanAmount;
}

/** Standard fixed-payment amortization: P x [r(1+r)^n] / [(1+r)^n - 1] */
function calculateMonthlyPrincipalAndInterest(principal, annualRate, termYears) {
  if (!(principal > 0)) return 0;
  const n = termYears * 12;
  const r = annualRate / 12;
  if (r === 0) return principal / n;
  const growth = Math.pow(1 + r, n);
  return (principal * r * growth) / (growth - 1);
}

function calculateMonthlyTaxes(purchasePrice, taxRate) {
  if (!(purchasePrice > 0)) return 0;
  return (purchasePrice * (taxRate != null ? taxRate : CONFIG.propertyTaxAnnualRate)) / 12;
}

function calculateHomeownersInsurance(purchasePrice) {
  return (purchasePrice * CONFIG.homeownersInsurance.annualRate) / 12;
}

function conventionalPmiRate(ltv) {
  const tier = CONFIG.conventional.pmiTiers.find(t => ltv <= t.maxLtv);
  return tier ? tier.annualRate : 0;
}

function calculateConventionalPMI(baseLoanAmount, ltv) {
  return (baseLoanAmount * conventionalPmiRate(ltv)) / 12;
}

function calculateFHAMIP(baseLoanAmount) {
  return (baseLoanAmount * CONFIG.fha.annualMipRate) / 12;
}

function calculateMonthlyMortgageInsurance(baseLoanAmount, ltv, loanType) {
  if (loanType === "conventional") return calculateConventionalPMI(baseLoanAmount, ltv);
  if (loanType === "fha") return calculateFHAMIP(baseLoanAmount);
  return CONFIG.va.monthlyMortgageInsurance;
}

/**
 * Full scenario for one home. Returns every figure the UI displays,
 * at full internal precision (rounding happens only at display time).
 */
function calculatePaymentScenario({ purchasePrice, downPayment, loanType, taxRate }) {
  const product = productCfg(loanType);
  const price = Math.max(0, purchasePrice || 0);
  const down = Math.min(Math.max(0, downPayment || 0), price);

  const baseLoanAmount = calculateBaseLoanAmount(price, down);
  const ltv = price > 0 ? baseLoanAmount / price : 0;
  const downPercent = price > 0 ? (down / price) * 100 : 0;

  const financedUpfront =
    loanType === "fha" ? calculateFHAUpfrontMIP(baseLoanAmount) :
    loanType === "va"  ? calculateVAFundingFee(baseLoanAmount) : 0;

  const financedLoanAmount = calculateFinancedLoanAmount(baseLoanAmount, loanType);
  const monthlyTaxes = calculateMonthlyTaxes(price, taxRate);
  const monthlyInsurance = calculateHomeownersInsurance(price);
  const monthlyMI = calculateMonthlyMortgageInsurance(baseLoanAmount, ltv, loanType);
  const pmiRate = loanType === "conventional" ? conventionalPmiRate(ltv)
                : loanType === "fha" ? CONFIG.fha.annualMipRate : 0;

  // Components are computed at full precision, then rounded to cents for display so
  // that the itemized breakdown always sums exactly to the displayed total.
  const round2 = (n) => Math.round((n + Number.EPSILON) * 100) / 100;

  const buildYear = (step) => {
    const pi = round2(calculateMonthlyPrincipalAndInterest(financedLoanAmount, step.rate, product.termYears));
    const tax = round2(monthlyTaxes);
    const hoi = round2(monthlyInsurance);
    const mi = round2(monthlyMI);
    return {
      key: step.key,
      label: step.label,
      rate: step.rate,
      note: step.note,
      buydown: !!step.buydown,
      principalAndInterest: pi,
      taxes: tax,
      insurance: hoi,
      mortgageInsurance: mi,
      total: round2(pi + tax + hoi + mi)
    };
  };

  const years = product.schedule.map(buildYear);

  return {
    price, down, downPercent, baseLoanAmount, ltv,
    financedUpfront, financedLoanAmount,
    monthlyTaxes, monthlyInsurance, monthlyMI, pmiRate,
    hasFinancedAddOn: financedUpfront > 0.005,
    product,
    hasBuydown: years.some(y => y.buydown),
    years
  };
}


/* =========================================================================
   Formatting helpers
   ========================================================================= */
const usd0 = (n) => "$" + Math.round(n || 0).toLocaleString("en-US");
const usd2 = (n) => "$" + (n || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pct = (n, d = 2) => (isFinite(n) ? n.toFixed(d).replace(/\.00$/, "") : "0") + "%";
/* Interest rates carry up to three decimals (3.375%), so they get their own
   formatter — pct() would round that to 3.38%. Trailing zeros are trimmed. */
const rateText = (decimalRate) =>
  (isFinite(decimalRate) ? Number((decimalRate * 100).toFixed(3)) : 0) + "%";
/* "Year 1 at 1.99%, Year 2 at 2.99%, ..." — generated so disclosure prose can
   never drift out of sync with the schedule above. */
const scheduleText = (product) =>
  product.schedule.map(s => s.label + " at " + rateText(s.rate)).join(", ");
const digitsOnly = (s) => String(s).replace(/[^\d]/g, "").replace(/^0+(?=\d)/, "");
const groupDigits = (d) => (d === "" ? "" : Number(d).toLocaleString("en-US"));
const toNumber = (s) => { const n = parseFloat(String(s).replace(/,/g, "")); return isFinite(n) ? n : 0; };

/** Whole-dollar input that keeps commas without the caret jumping. */
function CurrencyInput({ value, onChange, id, ariaLabel, placeholder }) {
  const ref = useRef(null);
  const caret = useRef(null);

  useEffect(() => {
    if (caret.current != null && ref.current && document.activeElement === ref.current) {
      ref.current.setSelectionRange(caret.current, caret.current);
    }
    caret.current = null;
  });

  const handle = (e) => {
    const el = e.target;
    const selStart = el.selectionStart == null ? el.value.length : el.selectionStart;
    const digitsBefore = el.value.slice(0, selStart).replace(/[^\d]/g, "").length;
    const digits = digitsOnly(el.value);
    const formatted = groupDigits(digits);

    let seen = 0, pos = formatted.length;
    if (digitsBefore === 0) {
      pos = 0;
    } else {
      for (let i = 0; i < formatted.length; i++) {
        if (/\d/.test(formatted[i])) seen++;
        if (seen === digitsBefore) { pos = i + 1; break; }
      }
    }
    caret.current = pos;
    onChange(digits);
  };

  return (
    <div className="input-affix pre">
      <span className="affix">$</span>
      <input
        id={id} ref={ref} className="txt" type="text"
        inputMode="numeric" autoComplete="off" aria-label={ariaLabel}
        placeholder={placeholder || "0"}
        value={groupDigits(value)} onChange={handle}
      />
    </div>
  );
}

/** Percent input allowing one decimal point, never negative. */
function PercentInput({ value, onChange, id, ariaLabel }) {
  const handle = (e) => {
    let v = e.target.value.replace(/[^\d.]/g, "");
    const parts = v.split(".");
    if (parts.length > 2) v = parts[0] + "." + parts.slice(1).join("");
    if (toNumber(v) > 100) v = "100";
    onChange(v);
  };
  return (
    <div className="input-affix post">
      <span className="affix">%</span>
      <input id={id} className="txt" type="text" inputMode="decimal" autoComplete="off"
             aria-label={ariaLabel} value={value} onChange={handle} placeholder="0" />
    </div>
  );
}

function Segmented({ options, value, onChange, ariaLabel, two }) {
  return (
    <div className={"seg" + (two ? " two" : "")} role="group" aria-label={ariaLabel}>
      {options.map(o => (
        <button key={o.value} type="button" aria-pressed={value === o.value}
                onClick={() => onChange(o.value)}>{o.label}</button>
      ))}
    </div>
  );
}

  useEffect(() => { if (openAll != null) setOpen(openAll); }, [openAll]);

  const price = toNumber(column.priceDigits);
  const requestedDown = dpMode === "percent"
    ? price * (toNumber(dpPercent) / 100)
    : toNumber(dpDollars);

  const priceMissing = column.priceDigits === "" || price <= 0;
  const downExceeds = !priceMissing && requestedDown > price;
  const valid = !priceMissing && !downExceeds;

  const taxRate = toNumber(column.taxPct) / 100;
  const scenario = useMemo(
    () => calculatePaymentScenario({ purchasePrice: price, downPayment: requestedDown, loanType, taxRate }),
    [price, requestedDown, loanType, taxRate]
  );

  const community = findCommunity(column.community);

  const selectCommunity = (e) => {

    onChange({
      community: e.target.value,
      planName: "",
      priceDigits: "",
      taxPct: c ? String(Number((c.taxRate * 100).toFixed(3))) : column.taxPct
    });
  };

  const selectPlan = (e) => {
    const name = e.target.value;

      ...column,
      planName: name,

  };

  const plan = findPlan(column.community, column.planName);

  return (
    <article className="card home" aria-label={"Home " + (index + 1)}>
      <div className="home-head">
        <p className="home-eyebrow">Home {index + 1}</p>

        <label className="lbl" htmlFor={"comm" + index}>Community</label>
        <select id={"comm" + index} className="txt" value={column.community} onChange={selectCommunity}>
          <option value="">Select a community</option>
          {["entry", "move-up", "luxury"].map(tier => (
            <optgroup key={tier} label={CONFIG.tierLabels[tier]}>
              {CONFIG.communities.filter(c => c.tier === tier).map(c => (
                <option key={c.name} value={c.name}>{c.name} — {c.city}</option>
              ))}
            </optgroup>
          ))}
        </select>

        <label className="lbl" htmlFor={"plan" + index} style={{ marginTop: 14 }}>Floor plan</label>
        <select id={"plan" + index} className="txt" value={column.planName} onChange={selectPlan} disabled={!community}>
          <option value="">{community ? "Select a floor plan" : "Pick a community first"}</option>
          {community && community.plans.map(p => (
            <option key={p.name} value={p.name}>
              {p.name} · {p.sqft.toLocaleString("en-US")} sf · {usd0(p.price)}
            </option>
          ))}
        </select>

        {plan && (
          <p className="tiny muted" style={{ margin: "6px 0 0" }}>
            {plan.beds} bed · {plan.baths} bath · {plan.sqft.toLocaleString("en-US")} sq ft · base price {usd0(plan.price)}
          </p>
        )}

        <div style={{ marginTop: 14 }}>
          <label className="lbl" htmlFor={"price" + index}>Purchase price (editable)</label>
          <CurrencyInput
            id={"price" + index}
            ariaLabel={"Purchase price for home " + (index + 1)}
            value={column.priceDigits}
            onChange={(digits) => onChange({ ...column, priceDigits: digits })}
          />
          <p className="tiny muted" style={{ margin: "6px 0 0" }}>
            {plan ? "Base price shown. " : ""}Adjust for upgrades, options, lot premium, or a specific quick move-in home.
          </p>
        </div>

        <div style={{ marginTop: 14 }}>
          <label className="lbl" htmlFor={"tax" + index}>Est. property tax rate (editable)</label>
          <PercentInput
            id={"tax" + index}
            ariaLabel={"Property tax rate for home " + (index + 1)}
            value={column.taxPct}
            onChange={(v) => onChange({ ...column, taxPct: v })}
          />
          <p className="tiny muted" style={{ margin: "6px 0 0" }}>
            Estimated total rate for {community ? community.city : "the community"}, all taxing units combined.
          </p>
        </div>

        {priceMissing && (
          <div className="warn">Enter a purchase price to see estimated payments.</div>
        )}
        {downExceeds && (
          <div className="warn">
            The down payment ({usd0(requestedDown)}) is more than this home's price. Lower the down payment to see estimated payments.
          </div>
        )}

        <div className="facts">
          <div className="fact"><span>Down payment</span><b>{valid ? usd0(scenario.down) : "—"}</b></div>
          <div className="fact"><span>Down payment percent</span><b>{valid ? pct(scenario.downPercent) : "—"}</b></div>
          <div className="fact"><span>Base loan amount</span><b>{valid ? usd0(scenario.baseLoanAmount) : "—"}</b></div>
          {valid && scenario.hasFinancedAddOn && (
            <React.Fragment>
              <div className="fact">
                <span>{loanType === "fha" ? "Financed upfront MIP" : "Financed VA funding fee"}</span>
                <b>{usd0(scenario.financedUpfront)}</b>
              </div>
              <div className="fact"><span>Total financed loan</span><b>{usd0(scenario.financedLoanAmount)}</b></div>
            </React.Fragment>
          )}
          <div className="fact">
            <span>Est. taxes &amp; insurance</span>
            <b>{valid ? usd0(scenario.monthlyTaxes + scenario.monthlyInsurance) + "/mo" : "—"}</b>
          </div>
        </div>

        {valid && scenario.monthlyInsurance === 0 && (
          <p className="tiny muted" style={{ margin: "10px 0 0" }}>
            {CONFIG.homeownersInsurance.excludedMessage}
          </p>
        )}
      </div>

      <PaymentSummary scenario={scenario} valid={valid} />

      <PaymentBreakdown
        id={"bd" + index}
        scenario={scenario}
        loanType={loanType}
        open={open && valid}
        onToggle={() => setOpen(v => !v)}
      />
    </article>
  );
}


/* =========================================================================
   FloorPlanComparison
   ========================================================================= */
function FloorPlanComparison({ columns, setColumns, loanType, dpMode, dpPercent, dpDollars }) {
  const [openAll, setOpenAll] = useState(null);
  const update = (i) => (next) => {
    const copy = columns.slice();
    copy[i] = next;
    setColumns(copy);
  };
  return (
    <section aria-label="Home comparison">
      <div className="notice">
        <span className="dot" aria-hidden="true">●</span>
        <span>{CONFIG.disclosures.shortNotice}</span>
      </div>
      <div className="cols">
        {columns.map((c, i) => (
          <FloorPlanCard
            key={i} index={i} column={c} onChange={update(i)}
            loanType={loanType} dpMode={dpMode} dpPercent={dpPercent} dpDollars={dpDollars}
            openAll={openAll}
          />
        ))}
      </div>
      <div style={{ textAlign: "center", marginTop: 12 }}>
        <button className="link-btn" type="button"
                onClick={() => setOpenAll(v => (v === true ? false : true))}>
          {openAll === true ? "Hide all payment breakdowns" : "Show all payment breakdowns"}
        </button>
      </div>
    </section>
  );
}


/* =========================================================================
   DisclosureFooter
   ========================================================================= */
function DisclosureFooter({ branding }) {
  return (
    <footer className="disclosure">
      <p>
        <b>Not a lender quote.</b> {CONFIG.disclosures.notALenderQuote}
      </p>
      {LOAN_TYPES.map(t => {
        const P = productCfg(t);
        return (
          <p key={t}>
            <b>{typeCfg(t).label} scenario illustrated:</b> {P.productName}, {P.termYears}-year amortization, {rateText(P.noteRate)} note rate.
            {P.buydownName
              ? <React.Fragment> A {P.buydownName} produces the following estimated payment rates: {scheduleText(P)}. The buydown reduces the borrower's scheduled payment for a limited period only. It does not change the {rateText(P.noteRate)} note rate, and qualifying is based on that note rate.</React.Fragment>
              : " No temporary buydown is applied."}
          </p>
        );
      })}
      <p>
        Property taxes are estimated using an approximate total tax rate for each community and the purchase price shown.
        Actual taxes depend on the appraisal district's assessed value, exemptions, and the rates adopted by each taxing unit.
        Homeowners insurance is estimated at {pct(CONFIG.homeownersInsurance.annualRate * 100)} of the purchase price per year.
      </p>
      <p>{CONFIG.disclosures.exclusions}</p>
      <p>{CONFIG.disclosures.full}</p>
      <p>
        {branding.builderName} &middot; {branding.builderLocation} &middot;{" "}
        <span className="eho">Equal Housing Opportunity</span>
      </p>
    </footer>
  );
}


/* =========================================================================
   App
   ========================================================================= */
function App() {
  const [branding, setBranding] = useState(CONFIG.branding);
  const [loanType, setLoanTypeRaw] = useState("conventional");
  const [dpMode, setDpModeRaw] = useState("percent");
  const [dpTouched, setDpTouched] = useState(false);

  const [dpPercent, setDpPercentRaw] = useState(String(CONFIG.conventional.defaultDownPaymentPercent));
  const [dpDollars, setDpDollarsRaw] = useState("");

  const [columns, setColumns] = useState(() =>
    CONFIG.defaultSelections.map(sel => {
      const c = findCommunity(sel.community);
      const plan = findPlan(sel.community, sel.plan);
      return {
        community: c ? c.name : "",
        planName: plan ? plan.name : "",
        priceDigits: plan && plan.price != null ? String(plan.price) : "",
        taxPct: String(Number(((c ? c.taxRate : CONFIG.propertyTaxAnnualRate) * 100).toFixed(3)))
      };
    })
  );

  const setDpPercent = (v) => { setDpPercentRaw(v); setDpTouched(true); };
  const setDpDollars = (v) => { setDpDollarsRaw(v); setDpTouched(true); };

  /* Loan type change: only reset the down payment if the agent has not edited it. */
  const setLoanType = (t) => {
    setLoanTypeRaw(t);
    if (!dpTouched) {
      const defPct = typeCfg(t).defaultDownPaymentPercent;
      setDpPercentRaw(String(defPct));
      const firstPrice = toNumber(columns[0].priceDigits);
      setDpDollarsRaw(firstPrice > 0 ? String(Math.round(firstPrice * defPct / 100)) : "");
    }
  };

  /* Mode change: convert and synchronize using the first priced home as the reference. */
  const setDpMode = (mode) => {
    if (mode === dpMode) return;
    const ref = columns.map(c => toNumber(c.priceDigits)).find(p => p > 0) || 0;
    if (mode === "dollar") {
      setDpDollarsRaw(ref > 0 ? String(Math.round(ref * toNumber(dpPercent) / 100)) : "");
    } else {
      setDpPercentRaw(ref > 0 ? String(Number(((toNumber(dpDollars) / ref) * 100).toFixed(3))) : "0");
    }
    setDpModeRaw(mode);
  };

  return (
    <div className="wrap">
      <BrandingHeader branding={branding} setBranding={setBranding} />

      <h1 className="title">{branding.pageTitle}</h1>
      <p className="subtitle">{branding.pageSubtitle}</p>

      <BuyerInputs
        loanType={loanType} setLoanType={setLoanType}
        dpMode={dpMode} setDpMode={setDpMode}
        dpPercent={dpPercent} setDpPercent={setDpPercent}
        dpDollars={dpDollars} setDpDollars={setDpDollars}
      />

      <FloorPlanComparison
        columns={columns} setColumns={setColumns}
        loanType={loanType} dpMode={dpMode} dpPercent={dpPercent} dpDollars={dpDollars}
      />

      <DisclosureFooter branding={branding} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
