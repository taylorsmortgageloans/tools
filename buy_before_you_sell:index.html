<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Buy Before You Sell — Quick Check</title>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  :root{
    --bg:#f5f7fa; --card:#fff; --ink:#1c2733; --muted:#63717f; --line:#e4e9f0;
    --brand:#1f4e79; --brand-soft:#eaf1f8;
    --good:#2f855a; --good-soft:#e9f5ee; --warn:#b7791f; --warn-soft:#fdf6e7;
    --bad:#b23b3b; --bad-soft:#fbeeee;
    --shadow:0 1px 3px rgba(20,40,60,.08); --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5;}
  .wrap{max-width:520px;margin:0 auto;padding:22px 16px 60px;}
  h1{font-size:23px;margin:0 0 4px;font-weight:700;letter-spacing:-.3px;}
  .lede{color:var(--muted);font-size:14.5px;margin:0 0 18px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px;}
  label.f{display:block;margin-bottom:16px;}
  label.f .lab{display:block;font-size:14px;font-weight:600;margin-bottom:6px;color:#31424f;}
  label.f .hint{font-weight:400;color:var(--muted);font-size:12.5px;}
  .money{position:relative;}
  .money .d{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:17px;pointer-events:none;}
  input[type=text],input[type=email],input[type=tel]{width:100%;padding:13px 14px 13px 26px;border:1.5px solid #cfdae5;border-radius:11px;
    font-size:17px;background:#fff;color:var(--ink);font-family:inherit;transition:.15s;}
  input.plain{padding-left:14px;}
  input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(31,78,121,.13);}
  .signal{border-radius:var(--radius);padding:20px;text-align:center;margin-bottom:16px;border:1px solid var(--line);}
  .signal.good{background:var(--good-soft);border-color:#bfe0cd;}
  .signal.warn{background:var(--warn-soft);border-color:#ecdcae;}
  .signal.bad{background:var(--bad-soft);border-color:#eec7c7;}
  .signal .emoji{font-size:30px;}
  .signal .head{font-size:20px;font-weight:750;margin:6px 0 4px;}
  .signal.good .head{color:#245c3c;} .signal.warn .head{color:#8a5d13;} .signal.bad .head{color:#8f2f2f;}
  .signal .say{font-size:14px;color:#3a4753;}
  .big{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:8px;}
  @media(max-width:440px){.big{grid-template-columns:1fr;}}
  .stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px;text-align:center;}
  .stat .t{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:6px;}
  .stat .v{font-size:26px;font-weight:750;letter-spacing:-.5px;color:var(--brand);}
  .stat .s{font-size:12px;color:var(--muted);margin-top:2px;}
  .story{display:flex;gap:10px;margin:14px 0 2px;}
  .story .s1{flex:1;background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:12px;text-align:center;}
  .story .s1 .n{font-size:11px;color:var(--brand);font-weight:700;text-transform:uppercase;letter-spacing:.4px;}
  .story .s1 .l{font-size:13px;font-weight:650;margin:3px 0;}
  .story .s1 .v{font-size:13px;color:var(--muted);}
  @media(max-width:440px){.story{flex-direction:column;}}
  .btn{display:block;width:100%;padding:15px;border-radius:12px;border:none;background:var(--brand);color:#fff;
    font-weight:700;font-size:16px;cursor:pointer;font-family:inherit;transition:.12s;}
  .btn:hover{background:#173d5f;}
  .btn.ghost{background:#fff;color:var(--brand);border:1.5px solid var(--brand);margin-top:10px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  details.mini{margin-top:6px;}
  details.mini summary{cursor:pointer;color:var(--brand);font-size:13px;font-weight:600;list-style:none;}
  details.mini summary::-webkit-details-marker{display:none;}
  details.mini .body{font-size:12.5px;color:var(--muted);padding:8px 0 0;line-height:1.55;}
  .taylor{background:var(--brand);color:#fff;border-radius:var(--radius);padding:16px 18px;text-align:center;}
  .taylor a{color:#cfe1f2;} .taylor .nm{font-weight:700;font-size:16px;}
  .foot{font-size:11.5px;color:var(--muted);line-height:1.55;margin-top:20px;font-style:italic;}
  .lead label.f{margin-bottom:12px;}
  .lead .grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;}
  @media(max-width:440px){.lead .grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useMemo} = React;

/* =========================================================
   AGENT QUICK-CHECK — simplified version
   Edit assumptions in ASSUMPTIONS, contact in TAYLOR,
   and swap the mailto in sendToTaylor() for a webhook/CRM.
   ========================================================= */
const TAYLOR = {
  name:"Taylor Wright", title:"Mortgage Loan Originator",
  phone:"801-833-1577", email:"taylor.wright@snmc.com",
  website:"TaylorsMortgageLoans.com", nmls:"NMLS #1497742", companyNmls:"Company NMLS #3116",
};
const ASSUMPTIONS = {
  maxBridgeLTV:0.75, bridgeRate:0.07999, combinedPct:0.0275, flatBridge:5500,
  monthsToSell:3, sellingPct:0.06, sellerTitle:2500,
  pointsPct:0.0275, otherPurchase:12000,
  rate:0.0675, termMonths:360, taxRate:0.006, insMonthly:95,
};

const num = v => { const n=parseFloat(String(v).replace(/[^0-9.]/g,"")); return isNaN(n)?0:n; };
const money = v => (v<0?"-":"")+"$"+Math.abs(Math.round(v)).toLocaleString("en-US");

function payment(P,mRate,n){ if(P<=0)return 0; const f=Math.pow(1+mRate,n); return P*mRate*f/(f-1); }

function calc(inp){
  const A=ASSUMPTIONS;
  const value=num(inp.value);
  const owed=num(inp.owed);
  const price=num(inp.price);
  const cash=num(inp.cash);
  const sale=value; // simple version assumes sale ~ current value

  // Max equity the bridge could free up for the next home
  const maxGross=value*A.maxBridgeLTV;
  const maxBase=(maxGross-A.flatBridge)/(1+A.combinedPct);
  const equityAvail=Math.max(0, maxBase-owed);

  // Use what's needed, never more than needed to buy the home + costs
  const needToZero=Math.max(0, price+A.otherPurchase-cash);
  const bridgeCashUsed=Math.min(equityAvail, needToZero);

  // New mortgage (solve circular points)
  const funds=cash+bridgeCashUsed;
  const newMortgage=Math.max(0,(price+A.otherPurchase-funds)/(1-A.pointsPct));
  const mRate=A.rate/12;
  const newPI=payment(newMortgage,mRate,A.termMonths);
  const taxes=price*A.taxRate/12;
  const newPayment=newPI+taxes+A.insMonthly;

  // Bridge balance + does the sale repay it?
  const grossBridge=(owed+bridgeCashUsed)*(1+A.combinedPct)+A.flatBridge;
  const bridgeLTV=value>0?grossBridge/value:0;
  const accrued=grossBridge*A.bridgeRate/12*A.monthsToSell;
  const payoff=grossBridge+accrued;
  const netSale=sale-sale*A.sellingPct-A.sellerTitle;
  const leftover=netSale-payoff;

  // Rough recast payment after applying leftover
  const balAfter=Math.max(0,newMortgage-Math.max(0,leftover));
  const recastPI=payment(balAfter,mRate,A.termMonths-A.monthsToSell);
  const recastPayment=recastPI+taxes+A.insMonthly;

  // Signal
  let signal="good";
  const hasInputs = value>0 && price>0;
  if(!hasInputs) signal="none";
  else if(equityAvail<=0 || bridgeLTV>A.maxBridgeLTV+0.001 || leftover<0) signal="bad";
  else if(leftover < value*0.05 || equityAvail < price*0.08) signal="warn"; // thin cushion, or too little usable equity to power the purchase
  else signal="good";

  return {value,owed,price,cash,equityAvail,bridgeCashUsed,newMortgage,newPayment,
    leftover,recastPayment,bridgeLTV,signal};
}

const SIGNALS={
  good:{emoji:"✅",head:"Looks promising",
    say:"Your client may have enough estimated equity to buy before selling. Worth sending to Taylor."},
  warn:{emoji:"🟡",head:"Worth a closer look",
    say:"The equity may be close. Don't promise anything — send it to Taylor for a real review."},
  bad:{emoji:"🔴",head:"Not a fit as entered",
    say:"These numbers don't appear to work, but a different price, sale value, or down payment might. Taylor can help."},
  none:{emoji:"🏡",head:"Enter the numbers above",
    say:"Fill in the current home value and the new home price to see an estimate."},
};

function Money({value,onChange,placeholder}){
  return <span className="money"><span className="d">$</span>
    <input type="text" inputMode="numeric" value={value} placeholder={placeholder||"0"}
      onChange={e=>onChange(e.target.value.replace(/[^0-9.]/g,""))}/></span>;
}

function App(){
  const [inp,setInp]=useState({value:"",owed:"",price:"",cash:""});
  const [lead,setLead]=useState({agent:"",email:"",client:""});
  const set=(k,v)=>setInp(p=>({...p,[k]:v}));
  const setL=(k,v)=>setLead(p=>({...p,[k]:v}));
  const r=useMemo(()=>calc(inp),[inp]);
  const sig=SIGNALS[r.signal];
  const show=r.signal!=="none";

  const sendToTaylor=()=>{
    /* FUTURE: replace this mailto with a POST to your CRM/webhook */
    const subj=encodeURIComponent("Buy Before You Sell — "+(lead.client||"client")+(lead.agent?(" (via "+lead.agent+")"):""));
    const body=encodeURIComponent(
`Hi Taylor — a possible buy-before-you-sell scenario:

Agent: ${lead.agent||"(name)"}   ${lead.email||""}
Client: ${lead.client||"(name)"}

Current home value: ${money(r.value)}
Still owed on it: ${money(r.owed)}
New home price: ${money(r.price)}
Cash available: ${money(r.cash)}

Quick estimate (${sig.head}):
• Estimated equity for the next home: ${money(r.bridgeCashUsed)} (up to ${money(r.equityAvail)})
• Estimated new-home payment: ${money(r.newPayment)}/mo
• Estimated cash left after the old home sells: ${money(r.leftover)}
• Estimated payment after applying that and recasting: ${money(r.recastPayment)}/mo

These are rough estimates from the quick-check tool — please verify the real numbers.`);
    window.location.href=`mailto:${TAYLOR.email}?subject=${subj}&body=${body}`;
  };

  return (
  <div className="wrap">
    <h1>Buy Before You Sell — Quick Check</h1>
    <p className="lede">See in about a minute whether your client could buy their next home before selling the current one — then send it to Taylor to confirm.</p>

    <div className="card">
      <label className="f"><span className="lab">Current home value</span>
        <Money value={inp.value} onChange={v=>set("value",v)} placeholder="500,000"/></label>
      <label className="f"><span className="lab">Still owed on the current home <span className="hint">mortgage + any HELOC/liens</span></span>
        <Money value={inp.owed} onChange={v=>set("owed",v)} placeholder="0"/></label>
      <label className="f"><span className="lab">New home price</span>
        <Money value={inp.price} onChange={v=>set("price",v)} placeholder="650,000"/></label>
      <label className="f" style={{marginBottom:4}}><span className="lab">Cash the buyer has for the purchase <span className="hint">optional</span></span>
        <Money value={inp.cash} onChange={v=>set("cash",v)} placeholder="0"/></label>
      <details className="mini"><summary>What's assumed?</summary>
        <div className="body">Uses Taylor's standard estimates: 75% max bridge, ~3-month sale window, 6% selling costs, and a 6.75% new-loan rate. The sale price is assumed near the current value. Real terms are confirmed by Taylor.</div>
      </details>
    </div>

    <div className={"signal "+r.signal}>
      <div className="emoji">{sig.emoji}</div>
      <div className="head">{sig.head}</div>
      <div className="say">{sig.say}</div>
    </div>

    {show && r.signal!=="bad" &&
    <div>
      <div className="big">
        <div className="stat"><div className="t">Equity for the next home</div>
          <div className="v">{money(r.bridgeCashUsed)}</div>
          <div className="s">estimated available now</div></div>
        <div className="stat"><div className="t">New-home payment</div>
          <div className="v">{money(r.newPayment)}</div>
          <div className="s">est. monthly, taxes & insurance in</div></div>
      </div>
      <div className="story">
        <div className="s1"><div className="n">Buy</div><div className="l">Move first</div><div className="v">{money(r.bridgeCashUsed)} equity used</div></div>
        <div className="s1"><div className="n">Sell</div><div className="l">Old home sells</div><div className="v">~{money(r.leftover)} left over</div></div>
        <div className="s1"><div className="n">Lower</div><div className="l">Recast payment</div><div className="v">~{money(r.recastPayment)}/mo</div></div>
      </div>
    </div>}

    <div className="card lead" style={{marginTop:16}}>
      <div style={{fontWeight:700,marginBottom:4}}>Send it to Taylor to verify</div>
      <p style={{fontSize:13.5,color:"var(--muted)",margin:"0 0 12px"}}>This is only an estimate. Taylor confirms the property value, payoff, qualification, and real loan terms.</p>
      <div className="grid">
        <label className="f"><span className="lab">Your name</span><input className="plain" type="text" value={lead.agent} onChange={e=>setL("agent",e.target.value)}/></label>
        <label className="f"><span className="lab">Your email</span><input className="plain" type="email" value={lead.email} onChange={e=>setL("email",e.target.value)}/></label>
      </div>
      <label className="f"><span className="lab">Client first name <span className="hint">optional</span></span><input className="plain" type="text" value={lead.client} onChange={e=>setL("client",e.target.value)}/></label>
      <button className="btn" onClick={sendToTaylor} disabled={!show}>Send Scenario to Taylor</button>
      <button className="btn ghost" onClick={()=>window.print()}>Print / Save</button>
    </div>

    <div className="taylor">
      <div className="nm">{TAYLOR.name}</div>
      <div style={{fontSize:13.5,opacity:.9}}>{TAYLOR.title}</div>
      <div style={{marginTop:4}}>{TAYLOR.phone} · <a href={"mailto:"+TAYLOR.email}>{TAYLOR.email}</a></div>
      <div style={{fontSize:12,opacity:.85,marginTop:3}}>{TAYLOR.website} · {TAYLOR.nmls} · {TAYLOR.companyNmls}</div>
    </div>

    <div className="foot">This tool provides preliminary estimates for planning purposes only. It is not a loan approval, prequalification, commitment to lend, rate lock, appraisal, or guarantee of proceeds. Actual rates, fees, values, loan amounts, qualification, and recast options are subject to change and must be confirmed through a complete review.</div>
  </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
